name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    # Runs the mock-based unit tests. These use dependency injection and a
    # MockDatabase, so no PostgreSQL service (and no database secrets) are needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run tests
        run: python -m pytest -q
